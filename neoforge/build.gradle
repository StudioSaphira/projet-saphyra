plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                rootProject.java_version as int
        )
    }
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        saphyra {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}

java { withSourcesJar() }

tasks.named('jar') {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar') {
    from(project(':common').sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
def publicationVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('version', publicationVersion)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand(version: publicationVersion)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "saphyra-neoforge-${rootProject.minecraft_version}"
            artifact(tasks.named('jar')) { classifier = null }
            artifact(tasks.named('sourcesJar')) { classifier = 'sources' }
            pom {
                name = 'Saphyra neoforge'
                description = 'Studio Saphira shared platform for Minecraft 1.21.1'
            }
        }
    }
}

base { archivesName = "saphyra-neoforge-${rootProject.minecraft_version}" }
