plugins {
    id 'base'
    id 'maven-publish'
}

group = 'net.saphyra'
version = providers.gradleProperty("saphyraVersion").getOrElse("${mod_version}-${version_type}${version_id}")

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// Produce correctly mapped runtime artifacts for each loader.
tasks.register('buildJar') {
    group = 'build'
    description = 'Builds the Fabric and NeoForge runtime JARs.'
    dependsOn ':fabric:remapJar', ':neoforge:jar'
}


tasks.register('buildAll') {
    dependsOn 'buildJar'
}

// A local file repository requires no hosting or credentials.
subprojects {
    apply plugin: 'maven-publish'
    publishing {
        repositories {
            maven {
                name = 'Development'
                url = rootProject.layout.buildDirectory.dir('repo')
            }
        }
    }
}
