plugins {
    id 'base'
    id 'maven-publish'
}

group = 'net.saphyra'
version = project.mod_version

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// Keep loader-specific bytecode isolated inside one distributable archive.
// Maven publications still expose the individual loader artifacts.
tasks.register('prepareUniversalMetadata', Copy) {
    from('distribution')
    into(layout.buildDirectory.dir('universal-metadata'))
    inputs.property('version', project.version.toString())
    expand(version: project.version.toString())
}

tasks.register('buildJar', Jar) {
    group = 'build'
    description = 'Builds one universal Saphyra JAR for Fabric and NeoForge.'
    archiveFileName = "${project.mod_id}-${project.mod_version}-${project.minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    dependsOn 'prepareUniversalMetadata', ':fabric:remapJar', ':neoforge:jar'

    from(tasks.named('prepareUniversalMetadata'))
    into('META-INF/jars') {
        from(project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }) {
            rename { 'saphyra-fabric.jar' }
        }
        from(project(':neoforge').tasks.named('jar').flatMap { it.archiveFile }) {
            rename { 'saphyra-neoforge.jar' }
        }
    }
    from(rootProject.projectDir) {
        include 'LICENSE.md', 'NOTICE.md', 'README.md', 'CHANGELOG.md'
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doLast {
        logger.lifecycle("Saphyra universal JAR: ${archiveFile.get().asFile.absolutePath}")
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the universal distribution JAR.'
    dependsOn 'buildJar'
}

// A local file repository requires no hosting or credentials.
subprojects {
    apply plugin: 'maven-publish'
    publishing {
        repositories {
            maven {
                name = 'Development'
                url = rootProject.layout.buildDirectory.dir('repo')
            }
        }
    }
}
